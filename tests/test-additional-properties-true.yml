name: Test additionalProperties input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - id: action
        uses: .
        with:
          values: tests/fixtures/values.yaml
          output: /tmp/addlprops-values.schema.json
          draft: 2020
          additionalProperties: "true"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "/tmp/addlprops-values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"
          cat "/tmp/addlprops-values.schema.json"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('/tmp/addlprops-values.schema.json'))"; then
            echo "FAIL: values.schema.json is not valid JSON"
            exit 1
          fi
          echo "PASS: schema is valid JSON"

      - name: Assert schema contains properties
        run: |
          SCHEMA=$(cat "/tmp/addlprops-values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q '"properties"'; then
            echo "FAIL: schema missing 'properties' key"
            exit 1
          fi
          echo "PASS: schema contains 'properties'"
