name: Test additionalProperties option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - id: action
        uses: .
        with:
          values: tests/fixtures/values.yaml
          output: /tmp/addl-values.schema.json
          draft: 2020
          noAdditionalProperties: "true"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "/tmp/addl-values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema has additionalProperties set to false
        run: |
          SCHEMA=$(cat "/tmp/addl-values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q '"additionalProperties": false'; then
            echo "FAIL: schema does not have additionalProperties=false at root"
            exit 1
          fi
          echo "PASS: schema has additionalProperties=false"
