name: Test additionalProperties input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: tests/fixtures/values-addprops.yaml
          output: tests/fixtures/values-addprops.schema.json
          draft: 2020
          additionalProperties: 'false'

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert output schema file was generated
        run: |
          if [ ! -f "tests/fixtures/values-addprops.schema.json" ]; then
            echo "FAIL: values-addprops.schema.json was not generated"
            exit 1
          fi
          echo "PASS: schema file exists"
          cat tests/fixtures/values-addprops.schema.json

      - name: Assert schema contains additionalProperties false
        run: |
          SCHEMA=$(cat tests/fixtures/values-addprops.schema.json)
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q '"additionalProperties"'; then
            echo "FAIL: schema does not contain additionalProperties"
            exit 1
          fi
          echo "PASS: schema contains additionalProperties"

      - name: Assert schema is valid JSON
        run: |
          SCHEMA=$(cat tests/fixtures/values-addprops.schema.json)
          if ! echo "$SCHEMA" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: schema is not valid JSON"
            exit 1
          fi
          echo "PASS: schema is valid JSON"
