name: Test basic schema generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Verify fixture files exist
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/"
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/values.yaml" ]; then
            echo "FAIL: values.yaml fixture not found"
            exit 1
          fi
          echo "PASS: fixture files exist"

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/tests/fixtures/values.yaml
          output: ${{ github.workspace }}/tests/fixtures/test-basic-output.schema.json

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set to '$PLUGIN_PATH'"

      - name: Assert plugin binary exists
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "Checking plugin binary at: $PLUGIN_PATH"
          if [ ! -f "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin binary not found at '$PLUGIN_PATH'"
            exit 1
          fi
          echo "PASS: plugin binary exists"

      - name: Assert schema file was generated
        run: |
          echo "Checking generated schema file..."
          SCHEMA_FILE="${{ github.workspace }}/tests/fixtures/test-basic-output.schema.json"
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "FAIL: schema file not found at $SCHEMA_FILE"
            ls -la "${{ github.workspace }}/tests/fixtures/" || true
            exit 1
          fi
          echo "PASS: schema file exists"
          cat "$SCHEMA_FILE"

      - name: Assert schema file is valid JSON
        run: |
          echo "Validating JSON..."
          SCHEMA_FILE="${{ github.workspace }}/tests/fixtures/test-basic-output.schema.json"
          if ! python3 -c "import json, sys; json.load(open('$SCHEMA_FILE'))"; then
            echo "FAIL: schema file is not valid JSON"
            exit 1
          fi
          echo "PASS: schema file is valid JSON"

      - name: Assert schema contains expected fields
        run: |
          SCHEMA=$(cat "${{ github.workspace }}/tests/fixtures/test-basic-output.schema.json")
          echo "Schema content: $SCHEMA"
          if echo "$SCHEMA" | grep -q '"properties"'; then
            echo "PASS: schema contains properties field"
          elif echo "$SCHEMA" | grep -q '"\$schema"'; then
            echo "PASS: schema contains dollar-schema field"
          else
            echo "FAIL: schema does not contain expected fields"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f "${{ github.workspace }}/tests/fixtures/test-basic-output.schema.json"
