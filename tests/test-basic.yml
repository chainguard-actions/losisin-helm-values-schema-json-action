name: Test basic schema generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/tests/fixtures/values.yaml
          output: /tmp/values.schema.json
          draft: "2020"
          working-directory: ${{ github.workspace }}

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/values.schema.json" ]; then
            echo "FAIL: output file /tmp/values.schema.json was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output is valid JSON
        run: |
          if ! python3 -m json.tool /tmp/values.schema.json > /dev/null 2>&1; then
            echo "FAIL: output file is not valid JSON"
            cat /tmp/values.schema.json
            exit 1
          fi
          echo "PASS: output file is valid JSON"

      - name: Assert schema contains expected fields
        run: |
          SCHEMA=$(cat /tmp/values.schema.json)
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys, json; d = json.load(sys.stdin); assert 'properties' in d, 'missing properties'"; then
            echo "FAIL: schema does not contain 'properties'"
            exit 1
          fi
          echo "PASS: schema contains 'properties'"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path output is set"
