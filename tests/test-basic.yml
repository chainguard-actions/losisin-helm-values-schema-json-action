name: Test basic schema generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-test"
          cat > "$GITHUB_WORKSPACE/helm-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
            pullPolicy: IfNotPresent
          service:
            type: ClusterIP
            port: 80
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
          EOF

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/helm-test/values.yaml
          output: ${{ github.workspace }}/helm-test/values.schema.json
          draft: 7
          indent: 4

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-test/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-test/values.schema.json"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert schema contains expected draft
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-test/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); schema_url=d.get('\$schema',''); assert 'draft-07' in schema_url or 'json-schema.org/draft-07' in schema_url, f'Expected draft-07 schema, got: {schema_url}'" 2>&1; then
            echo "FAIL: schema does not contain expected draft-07 reference"
            exit 1
          fi
          echo "PASS: schema contains draft-07 reference"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"
