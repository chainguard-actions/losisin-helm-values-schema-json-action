name: Test basic schema generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: tests/fixtures/values-basic.yaml
          output: tests/fixtures/values-basic.schema.json
          draft: 2020

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set to $PLUGIN_PATH"

      - name: Assert schema binary exists
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "Checking plugin path: $PLUGIN_PATH"
          if [ ! -f "$PLUGIN_PATH" ]; then
            echo "FAIL: schema binary not found at $PLUGIN_PATH"
            exit 1
          fi
          echo "PASS: schema binary exists"

      - name: Assert output schema file was generated
        run: |
          echo "Checking output file: tests/fixtures/values-basic.schema.json"
          if [ ! -f "tests/fixtures/values-basic.schema.json" ]; then
            echo "FAIL: values-basic.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values-basic.schema.json exists"
          cat tests/fixtures/values-basic.schema.json

      - name: Assert schema contains expected fields
        run: |
          SCHEMA=$(cat tests/fixtures/values-basic.schema.json)
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q '"replicaCount"'; then
            echo "FAIL: schema does not contain replicaCount"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q '"image"'; then
            echo "FAIL: schema does not contain image"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q '"service"'; then
            echo "FAIL: schema does not contain service"
            exit 1
          fi
          echo "PASS: schema contains expected fields"

      - name: Assert schema has correct draft version
        run: |
          SCHEMA=$(cat tests/fixtures/values-basic.schema.json)
          if ! echo "$SCHEMA" | grep -q '2020-12'; then
            echo "FAIL: schema does not use draft 2020-12"
            exit 1
          fi
          echo "PASS: schema uses draft 2020-12"
