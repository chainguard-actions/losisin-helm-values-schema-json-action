name: Test .schema.yaml config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/config-chart
          output: /tmp/config-values.schema.json

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema was generated from config file
        run: |
          if [ ! -f "/tmp/config-values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"
          cat "/tmp/config-values.schema.json"

      - name: Assert schema contains title from config file
        run: |
          SCHEMA=$(cat "/tmp/config-values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q 'Config File Schema'; then
            echo "FAIL: schema does not contain title from .schema.yaml config"
            exit 1
          fi
          echo "PASS: schema contains title from .schema.yaml config"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('/tmp/config-values.schema.json'))"; then
            echo "FAIL: values.schema.json is not valid JSON"
            exit 1
          fi
          echo "PASS: values.schema.json is valid JSON"
