name: Test custom draft version and indent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: tests/fixtures/values-draft7.yaml
          output: tests/fixtures/values-draft7.schema.json
          draft: 7
          indent: 2

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert output schema file was generated
        run: |
          if [ ! -f "tests/fixtures/values-draft7.schema.json" ]; then
            echo "FAIL: values-draft7.schema.json was not generated"
            exit 1
          fi
          echo "PASS: schema file exists"
          cat tests/fixtures/values-draft7.schema.json

      - name: Assert schema uses draft 7
        run: |
          SCHEMA=$(cat tests/fixtures/values-draft7.schema.json)
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q 'draft-07'; then
            echo "FAIL: schema does not use draft-07"
            exit 1
          fi
          echo "PASS: schema uses draft-07"

      - name: Assert schema is valid JSON
        run: |
          SCHEMA=$(cat tests/fixtures/values-draft7.schema.json)
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: schema is not valid JSON"
            exit 1
          fi
          echo "PASS: schema is valid JSON with 2-space indent"
