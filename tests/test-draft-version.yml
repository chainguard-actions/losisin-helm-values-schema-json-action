name: Test draft version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create values.yaml for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-draft-test"
          cat > "$GITHUB_WORKSPACE/helm-draft-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: helm-draft-test/values.yaml
          output: helm-draft-test/values.schema.json
          draft: 7
          indent: 2

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-draft-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema uses draft-07
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-draft-test/values.schema.json")
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import json,sys; d=json.load(sys.stdin); schema=d.get('\$schema',''); assert 'draft-07' in schema or 'draft/07' in schema, f'Expected draft-07 in schema, got: {schema}'"; then
            echo "FAIL: schema does not reference draft-07"
            exit 1
          fi
          echo "PASS: schema uses draft-07"
