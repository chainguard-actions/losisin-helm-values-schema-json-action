name: Test fail-on-diff feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture values file to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/values.yaml" "$GITHUB_WORKSPACE/values.yaml"

      - name: Create a stale/incorrect schema file
        run: |
          cat > "$GITHUB_WORKSPACE/values.schema.json" << 'EOF'
          {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "stale": {
                "type": "string"
              }
            }
          }
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add values.schema.json
          git commit -m "add stale schema"

      - id: action
        uses: .
        with:
          values: values.yaml
          draft: 2020
          output: values.schema.json
          fail-on-diff: "true"
        continue-on-error: true

      - name: Assert action failed due to diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail due to diff, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed due to diff"
