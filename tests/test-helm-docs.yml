name: Test useHelmDocs input
on:
  workflow_dispatch:
jobs:
  test-use-helm-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file with helm-docs comments
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-docs-test"
          cat > "$GITHUB_WORKSPACE/helm-docs-test/values.yaml" << 'EOF'
          # -- Number of replicas to deploy
          replicaCount: 1
          image:
            # -- Docker image repository
            repository: nginx
            # -- Docker image tag
            tag: latest
          service:
            # -- Kubernetes service type
            type: ClusterIP
            # -- Service port
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/helm-docs-test/values.yaml
          output: ${{ github.workspace }}/helm-docs-test/values.schema.json
          draft: 7
          indent: 4
          useHelmDocs: true

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-docs-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-docs-test/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-docs-test/values.schema.json"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert schema contains properties from values
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-docs-test/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); props=d.get('properties',{}); assert 'replicaCount' in props, f'Expected replicaCount in properties, got: {list(props.keys())}'" 2>&1; then
            echo "FAIL: schema does not contain expected properties"
            exit 1
          fi
          echo "PASS: schema contains expected properties"

      - name: Assert schema has descriptions from helm-docs comments
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-docs-test/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          props = d.get('properties', {})
          replica_desc = props.get('replicaCount', {}).get('description', '')
          print(f'replicaCount description: {replica_desc}')
          assert replica_desc != '', f'Expected description from helm-docs comment, got empty'
          " 2>&1; then
            echo "FAIL: schema does not contain helm-docs descriptions"
            exit 1
          fi
          echo "PASS: schema contains helm-docs descriptions"
