name: Test k8s schema options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create values.yaml for k8s schema testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/k8s-chart"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/k8s-chart/values.yaml" <<'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: tests/fixtures/k8s-chart/values.yaml
          output: tests/fixtures/k8s-chart/values.schema.json
          draft: 2020
          k8s-schema-version: '1.29.0'
          k8s-schema-url: 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v{{.K8sVersion}}-standalone-strict/{{.ResourceKind}}{{.ResourceAPIVersion}}.json'

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/k8s-chart/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('$GITHUB_WORKSPACE/tests/fixtures/k8s-chart/values.schema.json'))"; then
            echo "FAIL: values.schema.json is not valid JSON"
            exit 1
          fi
          echo "PASS: values.schema.json is valid JSON"

      - name: Assert plugin-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "actual plugin-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set to $ACTUAL"
