name: Test multiple values files (comma-separated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple values files for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/multi-chart"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/multi-chart/values.yaml" <<'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/multi-chart/values-production.yaml" <<'EOF'
          replicaCount: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          EOF

      - id: action
        uses: .
        with:
          values: tests/fixtures/multi-chart/values.yaml,tests/fixtures/multi-chart/values-production.yaml
          output: tests/fixtures/multi-chart/values.schema.json
          draft: 2020

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/multi-chart/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('$GITHUB_WORKSPACE/tests/fixtures/multi-chart/values.schema.json'))"; then
            echo "FAIL: values.schema.json is not valid JSON"
            exit 1
          fi
          echo "PASS: values.schema.json is valid JSON"

      - name: Assert schema contains properties from both files
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/tests/fixtures/multi-chart/values.schema.json")
          echo "schema: $SCHEMA"
          # replicaCount from values.yaml
          if ! echo "$SCHEMA" | grep -q '"replicaCount"'; then
            echo "FAIL: schema does not contain replicaCount from values.yaml"
            exit 1
          fi
          # resources from values-production.yaml
          if ! echo "$SCHEMA" | grep -q '"resources"'; then
            echo "FAIL: schema does not contain resources from values-production.yaml"
            exit 1
          fi
          echo "PASS: schema contains properties from both values files"

      - name: Assert plugin-path output is set
        env:
          ACTUAL: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "actual plugin-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set to $ACTUAL"
