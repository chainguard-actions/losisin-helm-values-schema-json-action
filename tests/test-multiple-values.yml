name: Test multiple values files (comma-separated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: tests/fixtures/values-base.yaml,tests/fixtures/values-extra.yaml
          output: tests/fixtures/values-combined.schema.json
          draft: 2020

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert combined schema file was generated
        run: |
          if [ ! -f "tests/fixtures/values-combined.schema.json" ]; then
            echo "FAIL: values-combined.schema.json was not generated"
            exit 1
          fi
          echo "PASS: combined schema file exists"
          cat tests/fixtures/values-combined.schema.json

      - name: Assert schema contains fields from both values files
        run: |
          SCHEMA=$(cat tests/fixtures/values-combined.schema.json)
          echo "Schema: $SCHEMA"
          # Fields from values-base.yaml
          if ! echo "$SCHEMA" | grep -q '"replicaCount"'; then
            echo "FAIL: schema does not contain replicaCount from base values"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q '"image"'; then
            echo "FAIL: schema does not contain image from base values"
            exit 1
          fi
          # Fields from values-extra.yaml
          if ! echo "$SCHEMA" | grep -q '"service"'; then
            echo "FAIL: schema does not contain service from extra values"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q '"resources"'; then
            echo "FAIL: schema does not contain resources from extra values"
            exit 1
          fi
          echo "PASS: schema contains fields from both values files"
