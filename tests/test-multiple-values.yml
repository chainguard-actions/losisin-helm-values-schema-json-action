name: Test multiple values files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple test values files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-multi-test"
          cat > "$GITHUB_WORKSPACE/helm-multi-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF

          cat > "$GITHUB_WORKSPACE/helm-multi-test/values-extra.yaml" << 'EOF'
          service:
            type: ClusterIP
            port: 80
          ingress:
            enabled: false
            host: example.com
          EOF

      - id: action
        uses: .
        with:
          values: helm-multi-test/values.yaml,helm-multi-test/values-extra.yaml
          output: helm-multi-test/values.schema.json
          draft: 2020
          working-directory: ${{ github.workspace }}

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json"
            exit 1
          fi
          echo "PASS: schema is valid JSON"

      - name: Assert schema contains fields from both files
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json")
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          props = d.get('properties', {})
          assert 'replicaCount' in props or 'image' in props, 'missing fields from values.yaml'
          assert 'service' in props or 'ingress' in props, 'missing fields from values-extra.yaml'
          print('Both files merged correctly')
          "; then
            echo "FAIL: schema does not contain fields from both values files"
            exit 1
          fi
          echo "PASS: schema contains fields from both values files"
