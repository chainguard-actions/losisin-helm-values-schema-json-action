name: Test multiple values files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple values files in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/test-values-base.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF

          cat > "$GITHUB_WORKSPACE/test-values-extra.yaml" << 'EOF'
          service:
            type: ClusterIP
            port: 80
          ingress:
            enabled: false
            host: example.com
          EOF

      - id: action
        uses: .
        with:
          values: test-values-base.yaml,test-values-extra.yaml
          output: test-values-multi.schema.json
          draft: 2020

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-values-multi.schema.json" ]; then
            echo "FAIL: expected test-values-multi.schema.json to exist"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/test-values-multi.schema.json'))"; then
            echo "FAIL: schema file is not valid JSON"
            exit 1
          fi
          echo "PASS: schema file is valid JSON"

      - name: Assert schema contains properties from both files
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/test-values-multi.schema.json")
          echo "Schema content: $SCHEMA"
          # Check for properties from first file
          if ! echo "$SCHEMA" | grep -q "replicaCount\|image"; then
            echo "FAIL: schema missing properties from first values file"
            exit 1
          fi
          # Check for properties from second file
          if ! echo "$SCHEMA" | grep -q "service\|ingress"; then
            echo "FAIL: schema missing properties from second values file"
            exit 1
          fi
          echo "PASS: schema contains properties from both values files"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"
