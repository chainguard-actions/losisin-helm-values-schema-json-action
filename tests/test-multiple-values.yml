name: Test multiple values files and schema metadata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-multi"
          cat > "$GITHUB_WORKSPACE/helm-multi/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF

          cat > "$GITHUB_WORKSPACE/helm-multi/values-prod.yaml" << 'EOF'
          replicaCount: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          EOF

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/helm-multi/values.yaml,${{ github.workspace }}/helm-multi/values-prod.yaml
          output: ${{ github.workspace }}/helm-multi/values.schema.json
          draft: 2020
          indent: 2
          title: My Helm Chart
          description: Schema for my helm chart values

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-multi/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-multi/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-multi/values.schema.json"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert schema contains title and description
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-multi/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('title')=='My Helm Chart', f'Expected title \"My Helm Chart\", got: {d.get(\"title\")}'" 2>&1; then
            echo "FAIL: schema title does not match"
            exit 1
          fi
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('description')=='Schema for my helm chart values', f'Expected description, got: {d.get(\"description\")}'" 2>&1; then
            echo "FAIL: schema description does not match"
            exit 1
          fi
          echo "PASS: schema contains expected title and description"

      - name: Assert schema contains properties from both files
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-multi/values.schema.json")
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); props=d.get('properties',{}); assert 'replicaCount' in props, 'missing replicaCount'; assert 'image' in props, 'missing image'; assert 'resources' in props, 'missing resources'" 2>&1; then
            echo "FAIL: schema missing expected properties from merged values files"
            exit 1
          fi
          echo "PASS: schema contains properties from both values files"
