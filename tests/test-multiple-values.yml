name: Test multiple values files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple values files for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-multi-test"
          cat > "$GITHUB_WORKSPACE/helm-multi-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

          cat > "$GITHUB_WORKSPACE/helm-multi-test/values-production.yaml" << 'EOF'
          replicaCount: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          EOF

      - id: action
        uses: .
        with:
          values: helm-multi-test/values.yaml,helm-multi-test/values-production.yaml
          output: helm-multi-test/values.schema.json
          draft: 2020
          indent: 4

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"
          cat "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json"

      - name: Assert schema contains properties from both files
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-multi-test/values.schema.json")
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'replicaCount' in d.get('properties', {}), 'replicaCount not found'"; then
            echo "FAIL: replicaCount not found in schema"
            exit 1
          fi
          if ! echo "$SCHEMA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'resources' in d.get('properties', {}), 'resources not found'"; then
            echo "FAIL: resources not found in schema (should come from production values)"
            exit 1
          fi
          echo "PASS: schema contains properties from both values files"
