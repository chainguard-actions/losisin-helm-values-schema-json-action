name: Test plugin-path output and binary availability
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - id: action
        uses: .
        with:
          values: tests/fixtures/values.yaml
          output: /tmp/plugin-values.schema.json
          draft: 2020

      - name: Assert plugin-path output is set and non-empty
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set to: $PLUGIN_PATH"

      - name: Assert plugin binary exists at plugin-path
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "Checking binary at: $PLUGIN_PATH"
          if [ ! -f "$PLUGIN_PATH" ]; then
            echo "FAIL: binary does not exist at plugin-path: $PLUGIN_PATH"
            exit 1
          fi
          echo "PASS: binary exists at plugin-path"

      - name: Assert plugin binary is executable
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "Checking if binary is executable: $PLUGIN_PATH"
          if [ ! -x "$PLUGIN_PATH" ]; then
            echo "FAIL: binary is not executable at plugin-path: $PLUGIN_PATH"
            exit 1
          fi
          echo "PASS: binary is executable"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "/tmp/plugin-values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"
          cat "/tmp/plugin-values.schema.json"
