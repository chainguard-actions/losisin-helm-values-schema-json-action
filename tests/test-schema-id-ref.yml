name: Test schema id and ref inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-id-ref-test"
          cat > "$GITHUB_WORKSPACE/helm-id-ref-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: helm-id-ref-test/values.yaml
          output: helm-id-ref-test/values.schema.json
          draft: 7
          id: "https://example.com/schemas/my-chart"
          ref: "https://example.com/schemas/base"
          working-directory: ${{ github.workspace }}

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-id-ref-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-id-ref-test/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-id-ref-test/values.schema.json"
            exit 1
          fi
          echo "PASS: schema is valid JSON"

      - name: Assert schema contains id field
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-id-ref-test/values.schema.json")
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          id_val = d.get('\$id', '')
          print(f'Found \$id: {id_val}')
          assert 'example.com' in id_val or id_val != '', f'Expected \$id to be set, got: {id_val}'
          print('PASS: \$id is set correctly')
          "; then
            echo "FAIL: schema \$id not set correctly"
            exit 1
          fi
          echo "PASS"
