name: Test schema id option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture values file to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/values.yaml" "$GITHUB_WORKSPACE/values.yaml"

      - id: action
        uses: .
        with:
          values: values.yaml
          draft: 2020
          indent: 4
          output: values.schema.json
          id: "https://example.com/schemas/my-chart"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: values.schema.json is not valid JSON"
            cat "$GITHUB_WORKSPACE/values.schema.json"
            exit 1
          fi
          echo "PASS: values.schema.json is valid JSON"

      - name: Assert schema contains the expected id
        run: |
          SCHEMA_CONTENT=$(cat "$GITHUB_WORKSPACE/values.schema.json")
          echo "Schema content: $SCHEMA_CONTENT"
          cat > /tmp/check_id.py << 'PYEOF'
          import sys, json
          d = json.load(sys.stdin)
          schema_id = d.get('$id', '')
          print(f'$id: {schema_id}')
          assert 'https://example.com/schemas/my-chart' in schema_id, \
            f'Expected $id to contain the provided URI, got: {schema_id}'
          print('PASS')
          PYEOF
          if ! echo "$SCHEMA_CONTENT" | python3 /tmp/check_id.py; then
            echo "FAIL: Schema does not contain expected \$id"
            exit 1
          fi
          echo "PASS: Schema contains expected \$id"
