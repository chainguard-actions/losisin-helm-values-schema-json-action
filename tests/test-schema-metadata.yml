name: Test schema metadata inputs (title, description, id)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: tests/fixtures/values-meta.yaml
          output: tests/fixtures/values-meta.schema.json
          draft: 2020
          title: My Helm Chart Schema
          description: Schema for my Helm chart values
          id: https://example.com/schema

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert output schema file was generated
        run: |
          if [ ! -f "tests/fixtures/values-meta.schema.json" ]; then
            echo "FAIL: values-meta.schema.json was not generated"
            exit 1
          fi
          echo "PASS: schema file exists"
          cat tests/fixtures/values-meta.schema.json

      - name: Assert schema contains title
        run: |
          SCHEMA=$(cat tests/fixtures/values-meta.schema.json)
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q 'My Helm Chart Schema'; then
            echo "FAIL: schema does not contain the expected title"
            exit 1
          fi
          echo "PASS: schema contains expected title"

      - name: Assert schema contains description
        run: |
          SCHEMA=$(cat tests/fixtures/values-meta.schema.json)
          if ! echo "$SCHEMA" | grep -q 'Schema for my Helm chart values'; then
            echo "FAIL: schema does not contain the expected description"
            exit 1
          fi
          echo "PASS: schema contains expected description"

      - name: Assert schema contains id
        run: |
          SCHEMA=$(cat tests/fixtures/values-meta.schema.json)
          if ! echo "$SCHEMA" | grep -q 'https://example.com/schema'; then
            echo "FAIL: schema does not contain the expected id"
            exit 1
          fi
          echo "PASS: schema contains expected id"
