name: Test schema with metadata (title, description, id)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create values.yaml in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/test-values-meta.yaml" << 'EOF'
          config:
            timeout: 30
            retries: 3
          EOF

      - id: action
        uses: .
        with:
          values: test-values-meta.yaml
          output: test-values-meta.schema.json
          draft: 2020
          title: My Helm Chart Schema
          description: Schema for my helm chart values

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-values-meta.schema.json" ]; then
            echo "FAIL: expected test-values-meta.schema.json to exist"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema contains title
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/test-values-meta.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q "My Helm Chart Schema"; then
            echo "FAIL: schema does not contain the expected title"
            exit 1
          fi
          echo "PASS: schema contains title"

      - name: Assert schema contains description
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/test-values-meta.schema.json")
          if ! echo "$SCHEMA" | grep -q "Schema for my helm chart values"; then
            echo "FAIL: schema does not contain the expected description"
            exit 1
          fi
          echo "PASS: schema contains description"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"
