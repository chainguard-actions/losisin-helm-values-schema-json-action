name: Test schema metadata inputs (id, ref, noAdditionalProperties)
on:
  workflow_dispatch:
jobs:
  test-id-and-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-meta"
          cat > "$GITHUB_WORKSPACE/helm-meta/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/helm-meta/values.yaml
          output: ${{ github.workspace }}/helm-meta/values.schema.json
          draft: 7
          indent: 4
          id: "https://example.com/schemas/my-chart"
          ref: "https://example.com/schemas/base"

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-meta/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-meta/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-meta/values.schema.json"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert schema contains id
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-meta/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); schema_id=d.get('\$id',''); assert schema_id != '', f'Expected \$id to be set, got empty'" 2>&1; then
            echo "FAIL: schema does not contain \$id"
            exit 1
          fi
          echo "PASS: schema contains \$id"

  test-no-additional-properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-noadd"
          cat > "$GITHUB_WORKSPACE/helm-noadd/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: ${{ github.workspace }}/helm-noadd/values.yaml
          output: ${{ github.workspace }}/helm-noadd/values.schema.json
          draft: 7
          indent: 4
          noAdditionalProperties: true

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-noadd/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-noadd/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-noadd/values.schema.json"
            exit 1
          fi
          echo "PASS: output is valid JSON"

      - name: Assert schema has additionalProperties false
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-noadd/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys,json; d=json.load(sys.stdin); ap=d.get('additionalProperties'); assert ap == False, f'Expected additionalProperties=false, got: {ap}'" 2>&1; then
            echo "FAIL: schema does not have additionalProperties=false at root"
            exit 1
          fi
          echo "PASS: schema has additionalProperties=false"
