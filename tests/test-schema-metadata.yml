name: Test schema metadata options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-meta-test"
          cat > "$GITHUB_WORKSPACE/helm-meta-test/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          EOF

      - id: action
        uses: .
        with:
          values: helm-meta-test/values.yaml
          output: helm-meta-test/values.schema.json
          draft: 7
          indent: 4
          title: "My Helm Chart Values"
          description: "Schema for my helm chart"
          working-directory: ${{ github.workspace }}

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not created"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: output is not valid JSON"
            cat "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json"
            exit 1
          fi
          echo "PASS: schema is valid JSON"

      - name: Assert schema contains title and description
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json")
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('title') == 'My Helm Chart Values', f'title mismatch: {d.get(\"title\")}'
          assert d.get('description') == 'Schema for my helm chart', f'description mismatch: {d.get(\"description\")}'
          print('Title and description are correct')
          "; then
            echo "FAIL: schema title or description is incorrect"
            exit 1
          fi
          echo "PASS: schema contains correct title and description"

      - name: Assert schema uses 4-space indentation
        run: |
          # Check that the file uses 4-space indentation (lines starting with 4 spaces)
          if ! grep -P "^    " "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json"; then
            echo "FAIL: schema does not appear to use 4-space indentation"
            cat "$GITHUB_WORKSPACE/helm-meta-test/values.schema.json"
            exit 1
          fi
          echo "PASS: schema uses 4-space indentation"
