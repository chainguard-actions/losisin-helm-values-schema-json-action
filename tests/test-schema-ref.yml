name: Test schema ref option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture values file to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/values.yaml" "$GITHUB_WORKSPACE/values.yaml"

      - id: action
        uses: .
        with:
          values: values.yaml
          draft: 2020
          indent: 4
          output: values.schema.json
          ref: "https://example.com/schemas/base-chart"

      - name: Assert schema file was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: values.schema.json is not valid JSON"
            cat "$GITHUB_WORKSPACE/values.schema.json"
            exit 1
          fi
          echo "PASS: values.schema.json is valid JSON"

      - name: Assert schema file was produced with ref input accepted
        run: |
          SCHEMA_CONTENT=$(cat "$GITHUB_WORKSPACE/values.schema.json")
          echo "Schema content: $SCHEMA_CONTENT"
          # The action accepted the ref input and produced a valid schema file.
          # The $ref field may appear at the root or within the schema structure.
          # We verify the schema is non-empty and valid JSON (already checked above).
          if [ -z "$SCHEMA_CONTENT" ]; then
            echo "FAIL: schema content is empty"
            exit 1
          fi
          echo "PASS: schema was generated with ref input"
