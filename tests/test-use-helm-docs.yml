name: Test useHelmDocs input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create values.yaml with helm-docs comments
        run: |
          cat > "$GITHUB_WORKSPACE/test-values-helmdocs.yaml" << 'EOF'
          # -- Number of replicas to deploy
          replicaCount: 1
          image:
            # -- Docker image repository
            repository: nginx
            # -- Docker image tag
            tag: latest
          service:
            # -- Service type
            type: ClusterIP
            # -- Service port
            port: 80
          EOF

      - id: action
        uses: .
        with:
          values: test-values-helmdocs.yaml
          output: test-values-helmdocs.schema.json
          draft: 2020
          useHelmDocs: true

      - name: Assert schema file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-values-helmdocs.schema.json" ]; then
            echo "FAIL: expected test-values-helmdocs.schema.json to exist"
            exit 1
          fi
          echo "PASS: schema file exists"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/test-values-helmdocs.schema.json'))"; then
            echo "FAIL: schema file is not valid JSON"
            exit 1
          fi
          echo "PASS: schema file is valid JSON"

      - name: Assert schema contains properties
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/test-values-helmdocs.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import json,sys; s=json.load(sys.stdin); assert 'properties' in s, 'missing properties'"; then
            echo "FAIL: schema missing 'properties' key"
            exit 1
          fi
          echo "PASS: schema contains properties"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"
