name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy chart fixture to workspace subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-chart"
          cp tests/fixtures/my-chart/values.yaml "$GITHUB_WORKSPACE/my-chart/values.yaml"

      - id: action
        uses: .
        with:
          values: values.yaml
          output: values.schema.json
          draft: 2020
          working-directory: my-chart

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema was generated in working directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/my-chart/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated in my-chart"
            exit 1
          fi
          echo "PASS: schema file exists in working directory"
          cat "$GITHUB_WORKSPACE/my-chart/values.schema.json"

      - name: Assert schema contains expected fields from chart values
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/my-chart/values.schema.json")
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q '"replicaCount"'; then
            echo "FAIL: schema does not contain replicaCount"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q '"ingress"'; then
            echo "FAIL: schema does not contain ingress"
            exit 1
          fi
          echo "PASS: schema contains expected fields"
