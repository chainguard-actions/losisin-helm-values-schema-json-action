name: Test working-directory option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - id: action
        uses: .
        with:
          values: values.yaml
          output: /tmp/workdir-values.schema.json
          draft: 2020
          working-directory: ${{ github.workspace }}/tests/fixtures/chart

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema was generated
        run: |
          if [ ! -f "/tmp/workdir-values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated"
            exit 1
          fi
          echo "PASS: values.schema.json exists"
          cat "/tmp/workdir-values.schema.json"

      - name: Assert schema contains expected properties
        run: |
          SCHEMA=$(cat "/tmp/workdir-values.schema.json")
          echo "Schema content: $SCHEMA"
          for prop in replicaCount image ingress; do
            if ! echo "$SCHEMA" | grep -q "\"$prop\""; then
              echo "FAIL: schema missing property: $prop"
              exit 1
            fi
          done
          echo "PASS: schema contains all expected properties"
