name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory with values file inside workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-helm-chart"
          cat > "$GITHUB_WORKSPACE/test-helm-chart/values.yaml" << 'EOF'
          replicaCount: 2
          image:
            repository: myapp
            tag: "1.0.0"
            pullPolicy: Always
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          EOF

      - id: action
        uses: .
        with:
          values: values.yaml
          output: values.schema.json
          draft: 2020
          working-directory: ${{ github.workspace }}/test-helm-chart

      - name: Assert schema file was created in working directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/test-helm-chart/values.schema.json" ]; then
            echo "FAIL: expected test-helm-chart/values.schema.json to exist"
            exit 1
          fi
          echo "PASS: schema file exists in working directory"

      - name: Assert schema is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('$GITHUB_WORKSPACE/test-helm-chart/values.schema.json'))"; then
            echo "FAIL: schema file is not valid JSON"
            exit 1
          fi
          echo "PASS: schema file is valid JSON"

      - name: Assert schema contains expected properties
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/test-helm-chart/values.schema.json")
          echo "Schema content: $SCHEMA"
          if ! echo "$SCHEMA" | grep -q "replicaCount"; then
            echo "FAIL: schema missing replicaCount property"
            exit 1
          fi
          if ! echo "$SCHEMA" | grep -q "resources"; then
            echo "FAIL: schema missing resources property"
            exit 1
          fi
          echo "PASS: schema contains expected properties"

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"
