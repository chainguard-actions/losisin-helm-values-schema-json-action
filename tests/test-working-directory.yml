name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          values: values.yaml
          output: /tmp/helm-chart-wd.schema.json
          draft: "2020"
          working-directory: ${{ github.workspace }}/tests/fixtures

      - name: Assert output file was created
        run: |
          if [ ! -f "/tmp/helm-chart-wd.schema.json" ]; then
            echo "FAIL: output file /tmp/helm-chart-wd.schema.json was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output is valid JSON
        run: |
          if ! python3 -m json.tool /tmp/helm-chart-wd.schema.json > /dev/null 2>&1; then
            echo "FAIL: output file is not valid JSON"
            cat /tmp/helm-chart-wd.schema.json
            exit 1
          fi
          echo "PASS: output file is valid JSON"

      - name: Assert schema contains expected properties
        run: |
          SCHEMA=$(cat /tmp/helm-chart-wd.schema.json)
          echo "Schema content:"
          echo "$SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import sys, json; d = json.load(sys.stdin); props = d.get('properties', {}); assert 'replicaCount' in props, f'missing replicaCount, got: {list(props.keys())}'"; then
            echo "FAIL: schema missing replicaCount property"
            exit 1
          fi
          echo "PASS: schema contains expected properties"
