name: Test working-directory option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          values: values.yaml
          output: test-workdir-output.schema.json
          working-directory: ${{ github.workspace }}/tests/fixtures

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema file was generated in working directory
        run: |
          echo "Checking generated schema file in working directory..."
          SCHEMA_PATH="${{ github.workspace }}/tests/fixtures/test-workdir-output.schema.json"
          if [ ! -f "$SCHEMA_PATH" ]; then
            echo "FAIL: schema file not found at $SCHEMA_PATH"
            ls -la "${{ github.workspace }}/tests/fixtures/" || true
            exit 1
          fi
          echo "PASS: schema file exists in working directory"
          cat "$SCHEMA_PATH"

      - name: Assert schema is valid JSON
        run: |
          SCHEMA_PATH="${{ github.workspace }}/tests/fixtures/test-workdir-output.schema.json"
          if ! python3 -c "import json; json.load(open('$SCHEMA_PATH'))"; then
            echo "FAIL: schema file is not valid JSON"
            exit 1
          fi
          echo "PASS: schema is valid JSON"

      - name: Cleanup
        if: always()
        run: |
          rm -f "${{ github.workspace }}/tests/fixtures/test-workdir-output.schema.json"
