name: Test working-directory option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create chart directory with values.yaml inside workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/helm-workdir-test/my-chart"
          cat > "$GITHUB_WORKSPACE/helm-workdir-test/my-chart/values.yaml" << 'EOF'
          replicaCount: 1
          image:
            repository: nginx
            tag: latest
          service:
            type: ClusterIP
            port: 80
          ingress:
            enabled: false
          EOF

      - id: action
        uses: .
        with:
          values: values.yaml
          output: values.schema.json
          draft: 2020
          indent: 4
          working-directory: ${{ github.workspace }}/helm-workdir-test/my-chart

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema was generated in working directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/helm-workdir-test/my-chart/values.schema.json" ]; then
            echo "FAIL: values.schema.json was not generated in working directory"
            exit 1
          fi
          echo "PASS: values.schema.json exists in working directory"
          cat "$GITHUB_WORKSPACE/helm-workdir-test/my-chart/values.schema.json"

      - name: Assert schema is valid JSON with expected properties
        run: |
          SCHEMA=$(cat "$GITHUB_WORKSPACE/helm-workdir-test/my-chart/values.schema.json")
          echo "Schema: $SCHEMA"
          if ! echo "$SCHEMA" | python3 -c "import json,sys; json.loads(sys.stdin.read())"; then
            echo "FAIL: generated schema is not valid JSON"
            exit 1
          fi
          if ! echo "$SCHEMA" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'replicaCount' in d.get('properties', {}), 'replicaCount not found'"; then
            echo "FAIL: replicaCount not found in schema"
            exit 1
          fi
          echo "PASS: schema is valid and contains expected properties"
