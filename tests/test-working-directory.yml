name: Test working-directory feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up chart directory with values file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-chart"
          cp "$GITHUB_WORKSPACE/tests/fixtures/values.yaml" "$GITHUB_WORKSPACE/my-chart/values.yaml"

      - id: action
        uses: .
        with:
          values: values.yaml
          draft: 2020
          indent: 4
          output: values.schema.json
          working-directory: my-chart

      - name: Assert plugin-path output is set
        env:
          PLUGIN_PATH: ${{ steps.action.outputs.plugin-path }}
        run: |
          echo "plugin-path: $PLUGIN_PATH"
          if [ -z "$PLUGIN_PATH" ]; then
            echo "FAIL: plugin-path output is empty"
            exit 1
          fi
          echo "PASS: plugin-path is set"

      - name: Assert schema file was generated in working directory
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/my-chart/values.schema.json" ]; then
            echo "FAIL: my-chart/values.schema.json was not generated"
            ls -la "$GITHUB_WORKSPACE/my-chart/" || true
            exit 1
          fi
          echo "PASS: my-chart/values.schema.json exists"

      - name: Assert schema file is valid JSON
        run: |
          if ! python3 -m json.tool "$GITHUB_WORKSPACE/my-chart/values.schema.json" > /dev/null 2>&1; then
            echo "FAIL: my-chart/values.schema.json is not valid JSON"
            cat "$GITHUB_WORKSPACE/my-chart/values.schema.json"
            exit 1
          fi
          echo "PASS: my-chart/values.schema.json is valid JSON"
